<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#071628">
 <link rel="icon" href="TemplateData/favicon.svg" type="image/svg+xml">
 <meta name="description" content="借光岛：把灯留给归人，把夜留给星辰。一则可以亲手改变的星空童话。">
 <title>借光岛 · 把星空还给夜晚</title>
 <style>
  *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071628;color:#e6e8dc;font-family:Georgia,'Songti SC','SimSun',serif}
  #unity-canvas{display:block;width:100vw;height:100vh;height:100svh;outline:none;background:#071628}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(90deg,rgba(4,15,30,.9),rgba(4,15,30,.48)),url(TemplateData/sky.png) center/cover;transition:opacity 1s ease;z-index:2}
  #loading.leaving{opacity:0;pointer-events:none}.invitation{width:min(460px,80vw)}.eyebrow{font-size:11px;letter-spacing:.27em;color:#d5b573;margin-bottom:42px}
  h1{font-size:clamp(48px,8vw,78px);font-weight:400;letter-spacing:.25em;margin:0 0 22px}p{font-size:18px;line-height:1.8;color:#becbd0;margin:0 0 44px}
  .track{height:1px;background:#344558;position:relative;margin-bottom:20px}.progress{position:absolute;left:0;top:0;height:1px;width:0;background:#dfbd7c;box-shadow:0 0 12px #dfbd7c;transition:width .2s}
  #status{font-size:13px;letter-spacing:.12em;color:#abbcc7;min-height:40px;line-height:1.8}#error{display:none;margin-top:24px;line-height:1.7;font-size:14px;color:#e3bea1}
  button{border:1px solid #96835b;background:transparent;color:#e2c58a;padding:10px 20px;font:inherit;cursor:pointer}button:hover{background:#192a38}button:focus-visible{outline:2px solid #e2c58a;outline-offset:4px}
  #retry{display:none;margin-top:22px}#fullscreen{position:fixed;bottom:16px;left:20px;border:0;padding:5px 9px;background:rgba(7,22,40,.5);font-size:12px;color:#93a4ac;z-index:1;opacity:0;transition:opacity .3s}body:hover #fullscreen,#fullscreen:focus-visible{opacity:1}
  #device-note{position:fixed;bottom:32px;left:10vw;font-size:12px;color:#91a1ad;max-width:80vw;line-height:1.7}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
 </style>
</head>
<body>
 <canvas id="unity-canvas" width="1440" height="900" tabindex="0" aria-label="借光岛游戏，回车启程，方向与灯罩操作见游戏内说明"></canvas>
 <div id="loading" role="status" aria-live="polite"><div class="invitation"><div class="eyebrow">BORROWED LIGHT / 第一卷</div><h1>借光岛</h1><p>把灯留给归人，<br>把夜留给星辰。</p><div class="track"><div class="progress" id="progress"></div></div><div id="status">正在收拢星光……</div><div id="error"></div><button id="retry" type="button">重新启程</button></div><div id="device-note">建议使用电脑、鼠标与键盘游玩。第一次抵达小岛，需要片刻等候。</div></div>
 <button id="fullscreen" type="button" aria-label="全屏游玩">全屏 ↗</button>
 <script src="Build/{{{ LOADER_FILENAME }}}"></script>
 <script>
  const canvas=document.getElementById('unity-canvas'),status=document.getElementById('status'),loading=document.getElementById('loading');
  const config={arguments:[],autoSyncPersistentDataPath:true,dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
   workerUrl:'Build/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
   codeUrl:'Build/{{{ CODE_FILENAME }}}',
#endif
   streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},devicePixelRatio:1,
   showBanner:(message,type)=>{if(type==='error')fail(message);}
  };
  function fail(message){status.textContent='星光暂时迷了路。';const error=document.getElementById('error');error.style.display='block';error.textContent='请确认使用较新的 Edge 或 Chrome，并重新打开游戏。'+String(message).slice(0,240);document.getElementById('retry').style.display='inline-block';}
  document.getElementById('retry').onclick=()=>location.reload();
  createUnityInstance(canvas,config,p=>{document.getElementById('progress').style.width=Math.round(p*100)+'%';status.textContent=p<.9?'正在收拢星光…… '+Math.round(p*100)+'%':'小岛即将醒来……';}).then(instance=>{window.borrowedLight=instance;loading.classList.add('leaving');setTimeout(()=>loading.remove(),1100);canvas.focus();document.getElementById('fullscreen').onclick=()=>{instance.SetFullscreen(1);canvas.focus();};}).catch(fail);
  canvas.addEventListener('pointerdown',()=>canvas.focus());
  canvas.addEventListener('contextmenu',event=>event.preventDefault());
  window.addEventListener('keydown',event=>{if(document.activeElement===canvas&&['Tab',' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key))event.preventDefault();});
 </script>
</body>
</html>
