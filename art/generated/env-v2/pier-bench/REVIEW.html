<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>栈桥与长椅：离线表面对照</title><style>body{max-width:1380px;margin:32px auto;padding:0 22px;background:#19232c;color:#e6e4da;font:16px/1.6 system-ui}h1{font-size:27px}label{margin-right:20px}select{padding:8px;background:#33424b;color:#fff;border:1px solid #61717a;border-radius:5px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{width:100%;display:block}figcaption{padding:10px;color:#c6c8c5}a{color:#e1bb78}.note{color:#bdc5cc}code{font-size:14px}@media(max-width:760px){main{grid-template-columns:1fr}}</style><h1>栈桥与长椅 · 只改木纹与材质</h1><p>原几何、尺寸、桥板顶面、座面、Marker 完全冻结；实际岛上 3 段栈桥 + 1 张长椅，新增 0 三角面。末端平台目前未放在岛中。</p><p><label>模型 <select id="asset"><option value="pier_module">栈桥段 · 456 tris</option><option value="pier_end">末端平台 · 668 tris · 未实例化</option><option value="bench">长椅 · 324 tris</option></select></label><label>光线 <select id="light"><option value="neutral">中性</option><option value="night">冷夜 / 暖灯</option></select></label><label>镜头 <select id="view"><option value="surface">表面</option><option value="whole">完整</option></select></label></p><main><figure><img id="before" alt="原模型同机位"><figcaption>原模型</figcaption></figure><figure><img id="after" alt="材质候选同机位"><figcaption>候选：同一几何，原创新木纹沿木材长轴</figcaption></figure></main><p class="note">全部图片为 Blender 真实 900 × 900 渲染，同机位、同照明。未进入 Unity；这里不是运行时画质或性能验证。木色仍偏干净，端面未制作独立年轮图，细纹和重复模块需实景复查。</p><p><a href="REVIEW.zh-CN.md">完整审阅</a> · <a href="final-verification.json">最终验证</a> · <a href="fresh-process-verification.json">独立进程回读</a> · <a href="INTERFACE-AUDIT.zh-CN.md">岛内接口审计</a></p><script>const names=['asset','light','view'];function update(){const[a,l,v]=names.map(n=>document.getElementById(n).value);for(const p of ['before','after'])document.getElementById(p).src=`${a}/${p}-${l}-${v}.png`;}for(const n of names)document.getElementById(n).onchange=update;update();</script></html>
